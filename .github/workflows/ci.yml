name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: record deterministic validation evidence
        shell: bash
        run: |
          cargo build --locked
          python3 tests/record_validation.py --output-dir "experiments/software-validation/results/${{ matrix.os }}" --runner-os "${{ matrix.os }}" --expected-unit-tests 22
      - name: upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.os }}
          path: experiments/software-validation/results/${{ matrix.os }}
          if-no-files-found: error

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  osaudit:
    name: osaudit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download current validation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: experiments/software-validation/results
      - name: Install pinned osaudit
        run: python3 -m pip install "git+https://github.com/ASSERT-KTH/osaudit.git@9f4b7ad02c32ae96f2978c09373a39896af366b8"
      - name: Verify real-model aggregation
        run: python3 experiments/real-gguf-qwen2.5-0.5b/scripts/aggregate_results.py --check
      - name: Verify software-validation aggregation
        run: python3 tests/aggregate_validation.py experiments/software-validation/results/ubuntu-latest experiments/software-validation/results/macos-latest experiments/software-validation/results/windows-latest --expected-os 3 --local-dir experiments/software-validation/results/windows-latest --output experiments/software-validation/results/table1-software-validation.json --expected-unit-tests 22
      - name: Verify artifact hashes
        working-directory: experiments/real-gguf-qwen2.5-0.5b
        run: sha256sum -c SHA256SUMS.txt
      - name: Audit all empirical claims
        run: osaudit all --json
