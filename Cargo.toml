[package]
name = "caleta"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A trust layer for private, local AI inference"
license = "Apache-2.0"
repository = "https://github.com/BiVelio/caleta"
homepage = "https://bivelio.com"
readme = "README.md"
keywords = ["llm", "local-ai", "privacy", "inference", "gguf"]
categories = ["command-line-utilities", "web-programming::http-server"]
exclude = ["target/", "*.gguf", "bench-results/", "informe*/"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.48", features = ["full"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
